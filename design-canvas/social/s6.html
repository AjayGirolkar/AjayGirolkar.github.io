<!-- S6 · Profile — restraint and native idiom.
     Bold move: the 3-up grid runs edge to edge with 1pt gutters and square corners, so
     the bottom two thirds of the screen is one continuous field of photography. Every
     control above it is a hairline outline; the accent does not appear on this screen
     at all, because nothing here is a primary action. -->
<div class="ios"><div class="island"></div><div class="stack">
{{SB}}
  <div class="by" style="height:44px">
    <span class="grow"><span class="hd" style="font-size:16.5px">{{HD_PRIYA}}</span></span>
    <svg class="i i--sm" style="margin-right:14px"><use href="#ic-bell"/></svg>
    <svg class="i i--sm"><use href="#ic-more"/></svg>
  </div>

  <div class="pad" style="display:flex;align-items:center;gap:22px;padding-top:6px">
    <img src="{{AV_PRIYA}}" alt="" style="width:82px;height:82px;border-radius:50%;object-fit:cover">
    <div style="flex:1;display:flex;justify-content:space-between;text-align:center">
      <span><div class="num" style="font-size:19px;font-weight:600;letter-spacing:-.02em">214</div>
        <div class="sub" style="font-size:12.5px">posts</div></span>
      <span><div class="num" style="font-size:19px;font-weight:600;letter-spacing:-.02em">18.4k</div>
        <div class="sub" style="font-size:12.5px">followers</div></span>
      <span><div class="num" style="font-size:19px;font-weight:600;letter-spacing:-.02em">391</div>
        <div class="sub" style="font-size:12.5px">following</div></span>
    </div>
  </div>

  <div class="pad" style="padding-top:12px">
    <div class="hd" style="font-size:15.5px">{{NM_PRIYA}}</div>
    <div class="cap" style="font-size:15px;line-height:1.3;margin-top:2px">Street and skate,
      mostly at 6am.<br>Shooting a 28mm and a dead flash.</div>
    <div class="sub" style="font-size:14px;margin-top:3px;color:var(--ink)">bandra.skateclub</div>
  </div>

  <div class="pad" style="display:flex;gap:8px;padding-top:14px;padding-bottom:16px">
    <button style="flex:1;height:34px;border-radius:8px;background:none;color:var(--ink);
      border:.5px solid var(--hairline);font-family:inherit;font-size:14.5px;font-weight:600">Follow</button>
    <button style="flex:1;height:34px;border-radius:8px;background:none;color:var(--ink);
      border:.5px solid var(--hairline);font-family:inherit;font-size:14.5px;font-weight:600">Message</button>
    <button style="width:40px;height:34px;border-radius:8px;background:none;color:var(--ink);
      border:.5px solid var(--hairline);display:grid;place-items:center">
      <svg class="i" style="width:16px;height:16px"><use href="#ic-person"/></svg></button>
  </div>

  <div style="display:flex;height:42px;border-top:.5px solid var(--hairline)">
    <span style="flex:1;display:grid;place-items:center;box-shadow:inset 0 -1.5px 0 var(--ink)">
      <svg class="i i--sm"><use href="#ic-grid"/></svg></span>
    <span style="flex:1;display:grid;place-items:center;color:var(--ink-3)">
      <svg class="i i--sm"><use href="#ic-person"/></svg></span>
  </div>

  <div class="scroll">
    <div class="g3">
      <img src="{{GR1}}" alt=""><img src="{{GR2}}" alt=""><img src="{{GR3}}" alt="">
      <img src="{{GR4}}" alt=""><img src="{{GR5}}" alt=""><img src="{{GR6}}" alt="">
      <img src="{{GR7}}" alt=""><img src="{{GR8}}" alt=""><img src="{{GR9}}" alt="">
    </div>
  </div>

  <div class="fade-b"></div>
  <div class="rail-tabs" style="position:absolute;left:0;right:0;bottom:16px;z-index:6;
       padding-left:26px;padding-right:26px">
    <span><svg class="i"><use href="#ic-house"/></svg></span>
    <span><svg class="i"><use href="#ic-search"/></svg></span>
    <span><svg class="i"><use href="#ic-plus"/></svg></span>
    <span><svg class="i"><use href="#ic-heart"/></svg></span>
    <span aria-current="page"><img src="{{AV_YOU}}" alt=""></span>
  </div>
  <div class="homebar"></div>
</div></div>
