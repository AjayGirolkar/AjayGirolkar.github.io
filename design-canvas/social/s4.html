<!-- S4 · Explore — the dense screen. Social has no dashboard, so this is where hierarchy
     under pressure gets proved.
     Bold move: a 2x2 anchor tile inside a 1pt-gutter mosaic. No radius anywhere, no gaps
     wide enough to read as cards -- the grid is a single sheet of photography that one
     frame happens to be four times larger inside. Chrome state: VISIBLE (not scrolled). -->
<div class="ios"><div class="island"></div><div class="stack">
{{SB}}
  <div class="pad" style="padding-bottom:12px">
    <div class="srch"><svg class="i i--sm" style="width:18px;height:18px"><use href="#ic-search"/></svg>
      <span style="flex:1">Search people, places, tags</span></div>
  </div>

  <div class="scroll">
    <div class="mos">
      <div class="x2"><img src="{{EX1}}" alt=""></div>
      <img src="{{EX2}}" alt=""><img src="{{EX3}}" alt="">
      <img src="{{EX4}}" alt=""><img src="{{EX5}}" alt=""><img src="{{EX6}}" alt="">
      <img src="{{EX7}}" alt=""><img src="{{EX8}}" alt=""><img src="{{EX9}}" alt="">
      <img src="{{EX10}}" alt=""><img src="{{EX11}}" alt=""><img src="{{EX12}}" alt="">
      <img src="{{EX13}}" alt=""><img src="{{EX14}}" alt="">
    </div>
  </div>

  <div class="fade-b"></div>
  <!-- the chrome, when it is showing: five bare glyphs on the ground. No bar, no glass,
       no labels, no pill -- fintech already spent the floating glass tab bar.  -->
  <div class="rail-tabs" style="position:absolute;left:0;right:0;bottom:16px;z-index:6;
       padding-left:26px;padding-right:26px">
    <span><svg class="i"><use href="#ic-house"/></svg></span>
    <span aria-current="page"><svg class="i"><use href="#ic-search"/></svg></span>
    <span><svg class="i"><use href="#ic-plus"/></svg></span>
    <span><svg class="i"><use href="#ic-heart"/></svg></span>
    <span><img src="{{AV_YOU}}" alt=""></span>
  </div>
  <div class="homebar"></div>
</div></div>
