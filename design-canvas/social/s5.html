<!-- S5 · Empty feed — the screen most portfolios skip.
     Bold move: one 40px sentence, set left, with nothing next to it. The "illustration"
     is the three real faces below it, because in a photography app a drawn spot
     illustration would be the only thing on screen that is not a photograph. -->
<div class="ios"><div class="island"></div><div class="stack">
{{SB}}
  <div class="by" style="height:52px">
    <span class="ttl" style="flex:1;letter-spacing:-.05em">SocialFlow</span>
    <svg class="i" style="color:var(--ink-2)"><use href="#ic-heart"/></svg>
    <svg class="i" style="color:var(--ink-2);margin-left:4px"><use href="#ic-msg"/></svg>
  </div>

  <div class="rail" style="padding-top:6px;padding-bottom:22px">
    <div class="st st--me"><div class="ring"><img src="{{AV_YOU}}" alt=""></div>
      <span class="plus"><svg class="i i--sm" style="width:12px;height:12px;stroke-width:2.6"><use href="#ic-plus"/></svg></span>
      <span>Your story</span></div>
  </div>

  <div class="pad" style="padding-top:40px">
    <h1 class="ttl ttl--xl" style="margin:0 0 14px">Nothing<br>here yet.</h1>
    <p class="cap" style="margin:0;color:var(--ink-2);font-size:16.5px;line-height:1.32;
       max-width:300px">Follow a few people and their photographs land here. Yours go out
       the same way.</p>
  </div>

  <div style="margin-top:34px">
    <div class="pad sub" style="padding-bottom:4px">Photographers worth following</div>
    <div class="sug"><img src="{{AV_ELENA}}" alt="">
      <span class="grow"><div class="hnd">{{HD_ELENA}}</div>
        <div class="sub" style="font-size:13px">{{NM_ELENA}} · 21 mutuals</div></span>
      <button class="ghost">Follow</button></div>
    <div class="sug"><img src="{{AV_TAREK}}" alt="">
      <span class="grow"><div class="hnd">{{HD_TAREK}}</div>
        <div class="sub" style="font-size:13px">{{NM_TAREK}} · 8 mutuals</div></span>
      <button class="ghost">Follow</button></div>
    <div class="sug"><img src="{{AV_JUNO}}" alt="">
      <span class="grow"><div class="hnd">{{HD_JUNO}}</div>
        <div class="sub" style="font-size:13px">{{NM_JUNO}} · 3 mutuals</div></span>
      <button class="ghost">Follow</button></div>
  </div>

  <div class="pad" style="padding-top:26px">
    <button class="act" style="width:100%;height:50px;border-radius:25px;font-size:16px">
      Find people you know</button>
  </div>

  <div class="fade-b"></div>
  <div class="rail-tabs" style="position:absolute;left:0;right:0;bottom:16px;z-index:6;
       padding-left:26px;padding-right:26px">
    <span aria-current="page"><svg class="i"><use href="#ic-house"/></svg></span>
    <span><svg class="i"><use href="#ic-search"/></svg></span>
    <span><svg class="i"><use href="#ic-plus"/></svg></span>
    <span><svg class="i"><use href="#ic-heart"/></svg></span>
    <span><img src="{{AV_YOU}}" alt=""></span>
  </div>
  <div class="homebar"></div>
</div></div>
