<!-- 02 · Breathe — the most extreme use of the density rule in the whole portfolio.
     One orb, one word, one number, and nothing else on 852pt. 4-7-8 is Andrew Weil's
     pattern and the counts are his: inhale 4, hold 7, exhale 8. The orb is caught at
     the top of the hold, which is why it is at its largest and the count reads 7. -->
<div class="ios">
<div class="stack">
  {{SB}}

  <div style="position:absolute;left:50%;top:238px;transform:translateX(-50%)">
    <div class="halo" style="width:420px;height:420px;left:-45px;top:-45px"></div>
    <div class="orb" style="width:330px;height:330px"></div>
  </div>

  <div style="position:absolute;left:0;right:0;top:352px;text-align:center;z-index:2">
    <p class="lbl" style="margin-bottom:14px">hold</p>
    <p class="fig" style="font-size:86px">7</p>
  </div>

  <div style="position:absolute;left:var(--margin);right:var(--margin);top:96px;
    text-align:center">
    <p class="lead" style="font-size:19px;color:var(--ink-2)">Cycle 3 of 8</p>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:96px;text-align:center">
    <div style="display:flex;gap:7px;justify-content:center;margin-bottom:28px">
      <span class="dot on"></span><span class="dot on"></span><span class="dot on"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span>
    </div>
    <p class="qt">in 4 &middot; hold 7 &middot; out 8</p>
  </div>

  <div class="home"></div>
</div>
</div>
