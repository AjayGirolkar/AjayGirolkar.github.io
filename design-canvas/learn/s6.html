<!-- 06 · League — the social screen, and the one place the app admits it is a game.
     Ranks carry a real consequence (top 7 promote, bottom 5 demote) drawn as two rules
     across the list, so the stakes are visible without a paragraph explaining them. -->
<div class="ios">
<div class="stack">
  {{SB}}

  <div style="background:var(--sky);padding:14px var(--margin) 20px">
    <p class="kick" style="color:rgba(255,255,255,.82)">Sapphire league</p>
    <p class="h1" style="color:#fff;margin-top:4px;font-size:28px">Top 7 move up</p>
    <p class="bd" style="color:rgba(255,255,255,.9);margin-top:6px;font-size:15px">
      2 days left &middot; you are 40 XP off promotion.</p>
  </div>

  <div style="padding:16px var(--margin) 0">
    <div style="display:flex;align-items:center;gap:12px;padding:11px 0">
      <span class="h2" style="width:26px;color:var(--amber)">5</span>
      <span class="avatar" style="background:var(--amber)">MR</span>
      <span class="bd" style="flex:1">Mar&iacute;a R.</span>
      <span class="h2">640</span></div>
    <div style="display:flex;align-items:center;gap:12px;padding:11px 0">
      <span class="h2" style="width:26px;color:var(--amber)">6</span>
      <span class="avatar" style="background:var(--leaf)">TK</span>
      <span class="bd" style="flex:1">Tomas K.</span>
      <span class="h2">615</span></div>
    <div style="display:flex;align-items:center;gap:12px;padding:11px 0">
      <span class="h2" style="width:26px;color:var(--amber)">7</span>
      <span class="avatar" style="background:var(--clay)">HL</span>
      <span class="bd" style="flex:1">Hanna L.</span>
      <span class="h2">590</span></div>

    <div style="display:flex;align-items:center;gap:10px;margin:6px 0">
      <hr class="hair" style="flex:1;background:var(--leaf);height:2px">
      <span class="kick" style="color:var(--leaf)">Promotion</span>
      <hr class="hair" style="flex:1;background:var(--leaf);height:2px">
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:13px 12px;
      background:var(--surface-el);border:2px solid var(--sky);border-radius:16px;
      box-shadow:0 4px 0 var(--sky-lip);margin:6px 0">
      <span class="h2" style="width:26px;color:var(--sky)">8</span>
      <span class="avatar">AG</span>
      <span class="bd" style="flex:1">You</span>
      <span class="h2" style="color:var(--sky)">550</span></div>

    <div style="display:flex;align-items:center;gap:12px;padding:11px 0">
      <span class="h2" style="width:26px;color:var(--ink-3)">9</span>
      <span class="avatar" style="background:var(--stone-lip)">JP</span>
      <span class="bd" style="flex:1">Joana P.</span>
      <span class="h2">522</span></div>
    <div style="display:flex;align-items:center;gap:12px;padding:11px 0">
      <span class="h2" style="width:26px;color:var(--ink-3)">10</span>
      <span class="avatar" style="background:var(--stone-lip)">DS</span>
      <span class="bd" style="flex:1">Diego S.</span>
      <span class="h2">498</span></div>

    <div style="display:flex;align-items:center;gap:10px;margin:6px 0">
      <hr class="hair" style="flex:1;background:var(--clay);height:2px">
      <span class="kick" style="color:var(--clay)">Demotion</span>
      <hr class="hair" style="flex:1;background:var(--clay);height:2px">
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:11px 0;opacity:.55">
      <span class="h2" style="width:26px;color:var(--ink-3)">11</span>
      <span class="avatar" style="background:var(--stone-lip)">RN</span>
      <span class="bd" style="flex:1">Rui N.</span>
      <span class="h2">470</span></div>
  </div>

  <div style="position:absolute;left:var(--margin);right:var(--margin);bottom:50px">
    <div class="cta">Earn 40 XP</div>
  </div>

  <div class="home"></div>
</div>
</div>
