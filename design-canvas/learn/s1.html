<!-- 01 · Path — navigation IS the content. No tab bar; the serpentine is the app's map,
     and gen.path() computes both the node positions and the dotted spine from one list,
     so a new unit cannot desync the two. The current node is larger, amber, and ringed. -->
<div class="ios">
<div class="stack">
  {{SB}}

  <div class="hud" style="padding-top:8px;padding-bottom:12px">
    <span class="m" style="color:var(--amber)">&#128293; 42</span>
    <span class="m" style="color:var(--clay)">&#9829; 4</span>
    <div class="bar"><i style="width:64%"></i></div>
    <span class="cap" style="font-weight:900;color:var(--ink)">64%</span>
  </div>

  <div style="background:var(--amber);padding:16px var(--margin) 18px;margin-bottom:8px">
    <p class="kick" style="color:rgba(255,255,255,.82)">Unit 4 &middot; Spanish</p>
    <p class="h1" style="color:#fff;margin-top:4px">Talking about yesterday</p>
    <p class="bd" style="color:rgba(255,255,255,.9);margin-top:6px;font-size:15px">
      Preterite vs imperfect &mdash; the one that decides whether you sound like a tourist.</p>
  </div>

  <div class="pathwrap" style="height:660px">{{PATH}}</div>

  <div class="home"></div>
</div>
</div>
