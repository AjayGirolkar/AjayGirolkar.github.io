<!-- 05 · Lesson complete — the reward beat, and the only screen that goes full-bleed
     colour. The numbers are earned rather than decorative: accuracy is the session's, the
     XP breakdown adds up, and the streak is the one on the path screen plus one. -->
<div class="ios">
<div class="stack" style="background:var(--leaf)">
  {{SB}}

  <div style="position:absolute;left:var(--margin);right:var(--margin);top:118px;
    text-align:center">
    <p style="font-size:74px;line-height:1;margin:0">&#127881;</p>
    <p class="h1" style="color:#fff;font-size:34px;margin-top:20px">Unit 4 complete</p>
    <p class="bd" style="color:rgba(255,255,255,.88);margin-top:8px">
      You can now talk about what you used to do.</p>
  </div>

  <div style="position:absolute;left:var(--margin);right:var(--margin);top:376px;
    display:flex;gap:12px">
    <div class="slab" style="flex:1;flex-direction:column;gap:3px;min-height:92px;
      border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.16);background:#fff">
      <span class="kick" style="color:var(--ink-2)">Accuracy</span>
      <span class="h1" style="font-size:28px;color:var(--leaf)">92%</span></div>
    <div class="slab" style="flex:1;flex-direction:column;gap:3px;min-height:92px;
      border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.16);background:#fff">
      <span class="kick" style="color:var(--ink-2)">Streak</span>
      <span class="h1" style="font-size:28px;color:var(--amber)">43</span></div>
    <div class="slab" style="flex:1;flex-direction:column;gap:3px;min-height:92px;
      border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.16);background:#fff">
      <span class="kick" style="color:var(--ink-2)">Time</span>
      <span class="h1" style="font-size:28px;color:var(--sky)">6:04</span></div>
  </div>

  <div style="position:absolute;left:var(--margin);right:var(--margin);top:504px;
    background:rgba(255,255,255,.16);border-radius:16px;padding:16px 18px">
    <div style="display:flex;justify-content:space-between;margin-bottom:9px">
      <span class="bd" style="color:#fff;font-size:15px">Lesson</span>
      <span class="bd" style="color:#fff;font-size:15px">+20 XP</span></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:9px">
      <span class="bd" style="color:rgba(255,255,255,.86);font-size:15px">No hearts lost after the first</span>
      <span class="bd" style="color:rgba(255,255,255,.86);font-size:15px">+5 XP</span></div>
    <div style="display:flex;justify-content:space-between;padding-top:10px;
      border-top:2px solid rgba(255,255,255,.28)">
      <span class="h2" style="color:#fff">Total</span>
      <span class="h2" style="color:#fff">+25 XP</span></div>
  </div>

  <div style="position:absolute;left:var(--margin);right:var(--margin);bottom:52px">
    <div class="cta" style="background:#fff;color:var(--leaf);box-shadow:0 4px 0 rgba(0,0,0,.16)">
      Continue</div>
  </div>

  <div class="home" style="background:#fff;opacity:.6"></div>
</div>
</div>
