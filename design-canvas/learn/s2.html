<!-- 02 · Multiple choice — one task, four big targets, nothing else. The distractors are
     PLAUSIBLE, not random: "comí" is the right preterite, "comía" the imperfect a learner
     confuses it with, "como" the present, "comeré" the future. A random wrong answer
     teaches nothing and reads as filler the moment a Spanish speaker sees the screen. -->
<div class="ios">
<div class="stack">
  {{SB}}

  <div class="hud" style="padding-top:8px;padding-bottom:20px">
    <svg class="i" style="color:var(--ink-3)"><use href="#ic-x"/></svg>
    <div class="bar"><i style="width:38%"></i></div>
    <span class="m" style="color:var(--clay)">&#9829; 4</span>
  </div>

  <div style="padding:0 var(--margin)">
    <p class="kick">Choose the correct form</p>
    <p class="h1" style="margin-top:10px;font-size:28px">Ayer <span class="blank"></span>
      paella en casa de mi abuela.</p>
    <p class="cap" style="margin-top:12px">Yesterday I ate paella at my grandmother&#8217;s.</p>
  </div>

  <div style="position:absolute;left:var(--margin);right:var(--margin);top:346px;
    display:flex;flex-direction:column;gap:14px">
    <div class="slab">com&iacute;a</div>
    <div class="slab sel">com&iacute;</div>
    <div class="slab">como</div>
    <div class="slab">comer&eacute;</div>
  </div>

  <div style="position:absolute;left:var(--margin);right:var(--margin);bottom:52px">
    <div class="cta">Check</div>
  </div>

  <div class="home"></div>
</div>
</div>
