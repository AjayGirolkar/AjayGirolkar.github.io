<div class="ios">
  <div class="island"></div>
  <div class="stack">
{{SB}}
    <div class="navbar">
      <svg class="i"><use href="#ic-chev-d"/></svg>
      <span style="font-size:15px;font-weight:600;letter-spacing:-.1px">Lower B · Posterior chain</span>
      <svg class="i"><use href="#ic-more"/></svg>
    </div>

    <div class="scroll">
      <div class="pad" style="margin-top:14px;display:flex;align-items:center;gap:14px">
        <div class="demo" style="width:78px;height:78px;border-radius:14px">
          <img src="{{IMG_RDL_0}}" alt="Romanian deadlift, start of the rep">
          <img class="f2" src="{{IMG_RDL_1}}" alt="">
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
            <div style="font-size:21px;font-weight:700;letter-spacing:-.5px">Romanian deadlift</div>
            <div class="lbl" style="font-size:10px;color:var(--accent);flex:none">Set 3 / 5</div>
          </div>
          <div class="lbl" style="font-size:10.5px;color:var(--ink-3);margin-top:6px">Last time · 70 kg × 8</div>
          <div class="setdots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
        </div>
      </div>

      <!-- BOLD MOVE: the value being edited at 88pt, sitting on its own ruler -->
      <div class="pad" style="margin-top:22px">
        <div class="big" style="font-size:88px">72.5<span class="u">kg</span></div>
      </div>
      <div class="ruler" style="margin-top:10px">
        <svg width="393" height="58" viewBox="0 0 393 58">{{RULER}}</svg>
        <span class="cursor"></span>
      </div>

      <div class="pad" style="display:flex;align-items:center;gap:14px;margin-top:24px">
        <div style="flex:none;width:74px">
          <div class="lbl" style="font-size:10px;color:var(--ink-3)">Reps</div>
        </div>
        <div class="stepper" style="flex:1">
          <span>&minus;</span>
          <b>8</b>
          <span>+</span>
        </div>
        <div class="chips" style="padding:0;flex:none"><span style="height:46px;border-radius:var(--r-ctl);padding:0 16px;color:var(--ink)">RPE 8</span></div>
      </div>

      <!-- dense set grid: the tabular counterweight to the 88pt numeral -->
      <div class="pad" style="margin-top:30px">
        <table class="grid" style="table-layout:fixed">
          <colgroup><col style="width:18%"><col style="width:34%"><col style="width:30%"><col style="width:18%"></colgroup>
          <thead><tr><th>Set</th><th>kg</th><th>Reps</th><th class="ck"></th></tr></thead>
          <tbody>
            <tr class="done"><td>1</td><td>60.0</td><td>10</td><td class="ck"><svg class="i i--sm" style="width:17px;height:17px;color:var(--accent)"><use href="#ic-check"/></svg></td></tr>
            <tr class="done"><td>2</td><td>67.5</td><td>9</td><td class="ck"><svg class="i i--sm" style="width:17px;height:17px;color:var(--accent)"><use href="#ic-check"/></svg></td></tr>
            <tr class="now"><td>3</td><td>72.5</td><td>8</td><td class="ck"><span style="display:inline-block;width:9px;height:9px;border-radius:5px;background:var(--accent)"></span></td></tr>
            <tr class="next"><td>4</td><td>72.5</td><td>8</td><td class="ck"></td></tr>
            <tr class="next"><td>5</td><td>77.5</td><td>6</td><td class="ck"></td></tr>
          </tbody>
        </table>
        <div class="lbl" style="font-size:10.5px;color:var(--ink-3);margin-top:16px;letter-spacing:.05em">
          Target 3 × 8 @ RPE 8 · +2.5 kg on last week</div>
      </div>
    </div>

    <div class="pad" style="flex:none;padding-bottom:26px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
        <span class="lbl" style="font-size:10px;color:var(--ink-3)">Rest</span>
        <span style="display:flex;align-items:baseline;gap:10px">
          <span class="big" style="font-size:17px;color:var(--accent)">1:12</span>
          <span class="lbl" style="font-size:10px;color:var(--ink-3)">Skip</span>
        </span>
      </div>
      <div class="restbar" style="margin-bottom:16px"><i style="width:60%"></i></div>
      <div class="cta">Log set 3</div>
    </div>
  </div>
  <div class="homebar"></div>
</div>
