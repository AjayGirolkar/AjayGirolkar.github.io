<div class="ios">
  <div class="flood">
    <div class="island"></div>
    <div class="stack">
{{SB}}
      <div class="scroll pad" style="display:flex;flex-direction:column;align-items:center">
        <!-- proof: all three rings closed -->
        <svg width="60" height="60" viewBox="0 0 60 60" style="margin-top:36px">
          <circle cx="30" cy="30" r="26" fill="none" stroke="#07090A" stroke-width="3.4"/>
          <circle cx="30" cy="30" r="18.5" fill="none" stroke="#07090A" stroke-width="3.4" opacity=".55"/>
          <circle cx="30" cy="30" r="11" fill="none" stroke="#07090A" stroke-width="3.4" opacity=".28"/>
        </svg>
        <div class="lbl" style="font-size:11px;color:rgba(7,9,10,.62);margin-top:16px">All three closed</div>

        <!-- BOLD MOVE: the entire app inverts and one numeral takes the screen -->
        <div class="big" style="font-size:224px;margin-top:30px">18</div>
        <div class="lbl" style="font-size:13px;margin-top:8px;color:#07090A">Day streak</div>
        <div style="font-size:14px;color:rgba(7,9,10,.62);margin-top:11px">Thu 27 Aug · your 3rd longest run</div>

        <!-- dense counterweight, outlined not filled -->
        <div style="display:flex;gap:8px;align-self:stretch;margin-top:40px">
          <div class="oline" style="flex:1">762<span style="font-size:11px;font-weight:600;opacity:.6;margin-left:4px">KCAL</span></div>
          <div class="oline" style="flex:1">47<span style="font-size:11px;font-weight:600;opacity:.6;margin-left:4px">MIN</span></div>
          <div class="oline" style="flex:1">12<span style="font-size:11px;font-weight:600;opacity:.6;margin-left:4px">HR</span></div>
        </div>

        <div style="align-self:stretch;margin-top:32px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px">
            <span class="lbl" style="font-size:10px;color:rgba(7,9,10,.62)">23 to beat your best</span>
            <span class="big" style="font-size:13px;color:rgba(7,9,10,.62)">18 / 41</span>
          </div>
          <div style="height:5px;border-radius:3px;background:rgba(7,9,10,.18);overflow:hidden">
            <i style="display:block;height:100%;width:44%;border-radius:3px;background:#07090A"></i>
          </div>
        </div>

        <div class="pr-line" style="align-self:stretch;margin-top:32px;
             padding-top:16px;border-top:1px solid rgba(7,9,10,.20)">
          <svg class="i i--sm" style="width:18px;height:18px;flex:none"><use href="#ic-bolt"/></svg>
          <span>New PR · Romanian deadlift <b class="big" style="font-size:14px">72.5</b> kg × 8</span>
        </div>
      </div>

      <div class="pad" style="flex:none;padding-bottom:24px">
        <div class="dark-cta">
          <svg class="i i--sm" style="width:19px;height:19px"><use href="#ic-share"/></svg>Share the streak</div>
        <div style="text-align:center;font-size:16px;font-weight:600;color:rgba(7,9,10,.62);margin-top:16px">Not now</div>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
