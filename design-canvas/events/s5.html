<!-- 05 · Ticket — the credential, and the one screen with a real object on it. Every
     other screen in GATE is containerless; this one is a die-cut stub with punched
     notches, a perforation and the app's only shadow. The scan matrix is DRAWN by
     gen.qr(): real finder squares and timing rows, no payload -- a live scannable code
     in a portfolio points at nothing, and pure noise reads as placeholder art. -->
<div class="ios ev-antipodes">
{{EVTHEME}}
<div class="stack">
  {{SB}}
  <div class="navbar"><svg class="i"><use href="#ic-chev-l"/></svg>
    <span style="font-variation-settings:'wdth' 100,'wght' 700">Your ticket</span>
    <svg class="i"><use href="#ic-more"/></svg></div>

  <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0 14px">
    <span class="live"><i></i></span>
    <span class="wide" style="color:var(--ev)">Live &middot; show this at the door</span>
  </div>

  <div style="padding:0 22px">
    <div class="tkt">
      <img src="{{IMG_TKT}}" alt="">
      <div style="padding:15px 17px 13px">
        <div class="wide" style="margin-bottom:7px">Sat 14 Mar 2026 &middot; 22:15</div>
        <h2 class="disp" style="font-size:34px">Antipodes</h2>
        <p class="sub" style="font-size:13px;margin-top:7px">The Foundry, Sheffield</p>
      </div>
      <div style="display:flex;gap:0;padding:0 17px 15px">
        <div class="fld"><span class="wide" style="font-size:10px">Entry</span><b>Standing</b></div>
        <div class="fld"><span class="wide" style="font-size:10px">Admits</span><b>1 of 2</b></div>
        <div class="fld"><span class="wide" style="font-size:10px">Order</span><b>A7F2&nbsp;3901</b></div>
      </div>
      <div class="punch"><i></i></div>
      <div style="display:flex;align-items:center;gap:16px;padding:4px 17px 18px">
        <div class="qr">{{QR}}</div>
        <div>
          <div class="wide" style="font-size:10px;margin-bottom:5px">Rotates every</div>
          <div class="num" style="font-size:21px;line-height:1;margin-bottom:12px">30s</div>
          <div class="wide" style="font-size:10px;margin-bottom:5px">Holder</div>
          <div class="num" style="font-size:15px;line-height:1.2">Ajay G.</div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:0 var(--margin) 30px">
    <hr class="hair" style="margin-bottom:2px">
    <div class="r"><span class="lbl">Return at face value</span>
      <svg class="i" style="width:17px;height:17px;color:var(--ink-3)"><use href="#ic-chev-r"/></svg></div>
    <hr class="hair">
    <div class="r"><span class="lbl">Add to Apple Wallet</span>
      <svg class="i" style="width:17px;height:17px;color:var(--ink-3)"><use href="#ic-chev-r"/></svg></div>
    <div class="home"></div>
  </div>
</div>
</div>
