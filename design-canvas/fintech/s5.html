<div class="ios">
  <div class="celebrate"></div>
  <div class="island"></div>
  <div class="stack">
{{SB}}
    <div class="navbar">
      <svg class="i" style="color:var(--ink-2)"><use href="#ic-x"/></svg>
      <span></span>
      <svg class="i" style="color:var(--ink-2)"><use href="#ic-share"/></svg>
    </div>

    <div class="scroll" style="display:flex;flex-direction:column;align-items:center">
      <svg width="393" height="320" viewBox="0 0 393 320" style="position:absolute;top:-30px;left:0;pointer-events:none">{{CONFETTI}}</svg>

      <!-- BOLD MOVE: a single 236pt ring closing at 100% -->
      <svg class="ring" width="236" height="236" viewBox="0 0 236 236" style="margin-top:34px">
        <circle cx="118" cy="118" r="104" stroke="color-mix(in srgb,var(--accent) 14%,transparent)" stroke-width="18"/>
        <circle cx="118" cy="118" r="104" stroke="var(--accent)" stroke-width="18" stroke-dasharray="653.5 0"/>
        <circle cx="118" cy="14" r="15" fill="var(--accent)"/>
        <path d="m112 14.2 4 4 7.6-8.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <g>
          <text x="118" y="102" text-anchor="middle" font-size="13" fill="var(--ink-2)">Emergency Fund</text>
          <text x="118" y="146" text-anchor="middle" class="rnd" font-size="38" font-weight="700" fill="var(--ink)" letter-spacing="-1.4">₹5,00,000</text>
          <text x="118" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="var(--accent)">100% funded</text>
        </g>
      </svg>

      <div class="pad" style="text-align:center;margin-top:24px">
        <div style="font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.15">Goal complete.</div>
        <div style="font-size:16px;color:var(--ink-2);margin-top:9px;line-height:1.4">
          You finished 11 months ahead of plan —<br>₹4,000 a month for 26 months.</div>
      </div>

      <div class="pad" style="width:100%;margin-top:22px">
        <div class="card" style="padding:14px 18px;display:flex;justify-content:space-between;text-align:center">
          <span><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.3px">26</div>
            <div style="font-size:12px;color:var(--ink-2);margin-top:2px">months</div></span>
          <span style="width:.5px;background:var(--hairline)"></span>
          <span><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.3px">₹1,04,000</div>
            <div style="font-size:12px;color:var(--ink-2);margin-top:2px">you contributed</div></span>
          <span style="width:.5px;background:var(--hairline)"></span>
          <span><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.3px;color:var(--gain)">₹36,000</div>
            <div style="font-size:12px;color:var(--ink-2);margin-top:2px">interest</div></span>
        </div>
      </div>

      <div class="pad" style="width:100%;margin-top:20px">
        <div class="sec-hd" style="padding:0 0 8px">Up next</div>
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:13px">
          <span class="mono" style="width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent)">
            <svg class="i i--sm"><use href="#ic-target"/></svg></span>
          <span style="flex:1;min-width:0">
            <div style="font-size:16px;letter-spacing:-.2px">Kerala trip, Dec 2027</div>
            <div style="font-size:12.5px;color:var(--ink-2);margin-top:2px">₹1,20,000 · suggested ₹5,000/mo</div></span>
          <svg class="i i--sm" style="color:var(--ink-3)"><use href="#ic-chev-r"/></svg>
        </div>
      </div>

      <div class="pad" style="width:100%;margin-top:auto;padding-bottom:26px">
        <div class="cta">Start your next goal</div>
        <div class="ghost" style="margin-top:10px">Share milestone</div>
      </div>
    </div>
  </div>
  <div class="homebar"></div>
</div>
