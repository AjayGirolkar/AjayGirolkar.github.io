<div class="ios">
  <div class="island"></div>
  <div class="stack">
{{SB}}
    <div class="navbar navbar--large" style="padding-top:2px"><h1>You</h1></div>

    <div class="scroll">
      <!-- BOLD MOVE (quiet by design): identity block carries the only weight -->
      <div class="pad" style="padding-top:6px">
        <div class="card" style="padding:18px 20px;display:flex;align-items:center;gap:15px">
          <span class="mono" style="width:56px;height:56px;border-radius:20px;background:var(--accent);color:#fff;font-size:20px">AG</span>
          <span style="flex:1;min-width:0">
            <div style="font-size:19px;font-weight:600;letter-spacing:-.3px">Ajay Girolkar</div>
            <div style="font-size:13.5px;color:var(--ink-2);margin-top:2px">ajaygirolkar@gmail.com</div>
            <div style="margin-top:7px"><span class="chip chip--gain">
              <svg class="i" style="width:12px;height:12px;stroke-width:2.6"><use href="#ic-check"/></svg>KYC verified</span></div>
          </span>
        </div>
      </div>

      <div class="sec-hd">Account</div>
      <div class="pad"><div class="inset">
        <div class="srow"><span class="ic" style="background:#0F7B6C"><svg class="i i--sm"><use href="#ic-card"/></svg></span>
          <span class="lb">Bank accounts</span><span class="val">HDFC ••4821</span>
          <svg class="i i--sm chev"><use href="#ic-chev-r"/></svg></div>
        <div class="srow"><span class="ic" style="background:#1F6FB2"><svg class="i i--sm"><use href="#ic-person"/></svg></span>
          <span class="lb">Nominee</span><span class="val">1 added</span>
          <svg class="i i--sm chev"><use href="#ic-chev-r"/></svg></div>
        <div class="srow"><span class="ic" style="background:#5B6570"><svg class="i i--sm"><use href="#ic-bookmark"/></svg></span>
          <span class="lb">Reports &amp; statements</span>
          <svg class="i i--sm chev"><use href="#ic-chev-r"/></svg></div>
      </div></div>

      <div class="sec-hd">Security</div>
      <div class="pad"><div class="inset">
        <div class="srow"><span class="ic" style="background:#0B5F55"><svg class="i i--sm"><use href="#ic-faceid"/></svg></span>
          <span class="lb">Unlock with Face&nbsp;ID</span><span class="tgl"></span></div>
        <div class="srow"><span class="ic" style="background:#5B6570"><svg class="i i--sm"><use href="#ic-lock"/></svg></span>
          <span class="lb">Hide balances</span><span class="tgl tgl--off"></span></div>
        <div class="srow"><span class="ic" style="background:#3A4550"><svg class="i i--sm"><use href="#ic-grid"/></svg></span>
          <span class="lb">Trusted devices</span><span class="val">2</span>
          <svg class="i i--sm chev"><use href="#ic-chev-r"/></svg></div>
      </div></div>

      <div class="sec-hd">Preferences</div>
      <div class="pad"><div class="inset">
        <div class="srow"><span class="ic" style="background:#2FA396"><svg class="i i--sm"><use href="#ic-bell"/></svg></span>
          <span class="lb">Notifications</span><span class="val">Price alerts</span>
          <svg class="i i--sm chev"><use href="#ic-chev-r"/></svg></div>
        <div class="srow"><span class="ic" style="background:#5B6570"><svg class="i i--sm"><use href="#ic-eye"/></svg></span>
          <span class="lb">Appearance</span><span class="val">Automatic</span>
          <svg class="i i--sm chev"><use href="#ic-chev-r"/></svg></div>
      </div></div>

      <div style="height:120px"></div>
    </div>
  </div>

  <nav class="tabbar glass glass--rim">
    <a class="tabitem"><svg class="i"><use href="#ic-pie"/></svg>Portfolio</a>
    <a class="tabitem"><svg class="i"><use href="#ic-card"/></svg>Spend</a>
    <a class="tabitem"><svg class="i"><use href="#ic-target"/></svg>Goals</a>
    <a class="tabitem" aria-current="page"><svg class="i"><use href="#ic-person"/></svg>You</a>
  </nav>
  <div class="homebar"></div>
</div>
