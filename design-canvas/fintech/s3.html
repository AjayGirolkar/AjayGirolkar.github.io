<div class="ios">
  <div class="island"></div>
  <div class="stack">
    <!-- BOLD MOVE: full-bleed ink hero, 1Y chart owns the top half -->
    <div class="hero-dark" style="padding-bottom:14px">
{{SB}}
      <div class="navbar" style="font-weight:500">
        <svg class="i"><use href="#ic-chev-l"/></svg>
        <span style="text-align:center;line-height:1.15">
          <div style="font-size:15px;font-weight:600;letter-spacing:.2px">RELIANCE</div>
          <div style="font-size:11px;color:var(--ink-2)">NSE · Equity</div></span>
        <svg class="i"><use href="#ic-star"/></svg>
      </div>

      <div class="pad" style="padding-top:8px">
        <div class="hero-amt" style="font-size:38px;letter-spacing:-1.2px"><span class="cur">₹</span>2,979<span class="dec">.90</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
          <span class="pill pill--gain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>₹463.55</span>
          <span class="num" style="font-size:13px;font-weight:600;color:var(--gain)">+18.42%</span>
          <span style="font-size:13px;color:var(--ink-3)">1 year</span>
        </div>
      </div>

      <svg width="393" height="178" viewBox="0 0 393 178" style="display:block;margin-top:6px">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2FBFA8" stop-opacity=".34"/>
          <stop offset="1" stop-color="#2FBFA8" stop-opacity="0"/></linearGradient></defs>
        <line x1="0" y1="124" x2="393" y2="124" stroke="rgba(255,255,255,.13)" stroke-width="1" stroke-dasharray="2 4"/>
        <path d="{{HERO_A}}" fill="url(#hg)"/>
        <path d="{{HERO_D}}" fill="none" stroke="#2FBFA8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="{{HERO_X}}" cy="{{HERO_Y}}" r="9" fill="#2FBFA8" opacity=".20"/>
        <circle cx="{{HERO_X}}" cy="{{HERO_Y}}" r="3.4" fill="#2FBFA8"/>
        <text x="12" y="120" font-size="10" fill="rgba(255,255,255,.40)">₹2,516</text>
      </svg>

      <div class="pad" style="margin-top:2px">
        <div class="seg"><span>1D</span><span>1W</span><span>1M</span><span>6M</span><span data-on>1Y</span><span>ALL</span></div>
      </div>
    </div>

    <div class="scroll" style="background:var(--surface)">
      <div class="pad" style="padding-top:16px">
        <div class="card" style="padding:4px 20px 8px">
          <div class="stat-grid">
            <div><div class="k">Open</div><div class="v">₹2,998.40</div></div>
            <div><div class="k">Prev close</div><div class="v">₹2,998.55</div></div>
            <div><div class="k">Day range</div><div class="v">2,961 – 3,004</div></div>
            <div><div class="k">52-wk high</div><div class="v">₹3,217.90</div></div>
            <div><div class="k">Market cap</div><div class="v">₹20.16L Cr</div></div>
            <div><div class="k">P / E</div><div class="v">28.4</div></div>
          </div>
        </div>
      </div>

      <div class="sec-hd">Your position</div>
      <div class="pad"><div class="card" style="padding:16px 20px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:15px;color:var(--ink-2)">92 shares · avg ₹2,640.20</span>
          <span class="num" style="font-size:19px;font-weight:700;letter-spacing:-.4px">₹2,74,150</span>
        </div>
        <hr class="hair" style="margin:13px 0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:15px;color:var(--ink-2)">Unrealised P&amp;L</span>
          <span style="display:flex;align-items:baseline;gap:8px">
            <span class="num" style="font-size:17px;font-weight:600;color:var(--gain)">+₹31,270</span>
            <span class="chip chip--gain num">+12.86%</span></span>
        </div>
      </div></div>
      <div style="height:120px"></div>
    </div>
  </div>

  <div class="actionbar glass glass--rim">
    <span class="b b--sell">Sell</span>
    <span class="b b--buy">Buy</span>
  </div>
  <div class="homebar"></div>
</div>
