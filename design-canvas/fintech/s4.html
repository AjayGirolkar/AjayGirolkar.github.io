<div class="ios">
  <div class="scrim">
    <div class="blurstrip">
      <svg width="393" height="200" viewBox="0 0 393 178" style="position:absolute;top:-10px">
        <path d="{{HERO_A}}" fill="#2FBFA8" fill-opacity=".22"/>
        <path d="{{HERO_D}}" fill="none" stroke="#2FBFA8" stroke-width="3"/>
      </svg>
    </div>
  </div>
  <div class="island"></div>
<div style="color:#fff;position:relative;z-index:6">{{SB}}</div>

  <!-- BOLD MOVE: order sheet where the amount is the entire top third -->
  <div class="sheet">
    <div class="grabber"></div>
    <div class="navbar" style="height:50px">
      <span style="width:24px"></span>
      <span style="font-size:17px;font-weight:600">Buy RELIANCE</span>
      <svg class="i" style="color:var(--ink-3)"><use href="#ic-x"/></svg>
    </div>

    <div class="pad">
      <div class="seg" style="margin-bottom:20px"><span data-on>Delivery</span><span>Intraday</span><span>MTF</span></div>

      <div style="text-align:center">
        <div style="font-size:13px;color:var(--ink-2)">Amount to invest</div>
        <div class="hero-amt" style="font-size:46px;margin-top:6px;letter-spacing:-1.6px">
          <span class="cur">₹</span>45,000<span style="display:inline-block;width:2.5px;height:38px;background:var(--accent);border-radius:2px;vertical-align:-4px;margin-left:3px"></span></div>
        <div class="num" style="font-size:13.5px;color:var(--ink-2);margin-top:8px">≈ 15 shares at ₹2,979.90 · ₹1,301.50 left over</div>
      </div>

      <div class="quick" style="margin-top:18px">
        <span>₹10,000</span><span>₹25,000</span><span data-on>₹45,000</span><span>Max</span>
      </div>

      <hr class="hair" style="margin:16px 0 4px">
      <div class="inforow"><span class="k">Order type</span>
        <span class="v">Market <svg class="i i--sm" style="color:var(--ink-3)"><use href="#ic-chev-r"/></svg></span></div>
      <div class="inforow" style="padding-top:0"><span class="k">Available margin</span>
        <span class="v">₹1,24,860.00</span></div>

      <div class="keys" style="margin-top:14px">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button class="k-alt">.</button><button>0</button>
        <button class="k-alt"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-2)"><path d="M9 5h9.6A1.9 1.9 0 0 1 20.5 6.9v10.2A1.9 1.9 0 0 1 18.6 19H9L3.2 12.6a.9.9 0 0 1 0-1.2Z"/><path d="M11.6 9.6 16.4 14.4M16.4 9.6 11.6 14.4"/></svg></button>
      </div>

      <div class="cta" style="margin-top:16px">Review order</div>
      <div class="num" style="text-align:center;font-size:12px;color:var(--ink-3);margin-top:9px">
        Settles T+1 · Brokerage ₹0 on delivery</div>
    </div>
  </div>
  <div class="homebar"></div>
</div>
