<style>
/* ---------- WealthKit: fintech app layer ---------- */
.ios{--accent:#0F7B6C;--accent-2:#0B5F55;}
[data-theme="dark"] .ios,
.ios[data-theme="dark"]{--accent:#2FBFA8;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ios{--accent:#2FBFA8}}

.statusbar,.navbar{flex:none}
.stack{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:hidden;position:relative}
.pad{padding-left:var(--margin);padding-right:var(--margin)}

/* status bar glyphs */
.sb-sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.sb-sig i{width:3px;background:currentColor;border-radius:1px;display:block}
.sb-sig i:nth-child(1){height:4px}.sb-sig i:nth-child(2){height:6px}
.sb-sig i:nth-child(3){height:8.5px}.sb-sig i:nth-child(4){height:11px}
.sb-bat{width:25px;height:12px;border:1.1px solid currentColor;border-radius:3.4px;
        opacity:.9;position:relative;padding:1.4px}
.sb-bat::after{content:"";position:absolute;right:-3px;top:3.6px;width:1.6px;height:4.4px;
        border-radius:0 1px 1px 0;background:currentColor;opacity:.5}
.sb-bat b{display:block;height:100%;width:72%;background:currentColor;border-radius:1.6px}

/* hero money figure */
.hero-amt{font-family:var(--f-round);font-variant-numeric:tabular-nums;
          font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1}
.hero-amt .cur{font-size:30px;font-weight:600;letter-spacing:-1px;vertical-align:5px;opacity:.55}
.hero-amt .dec{font-size:30px;opacity:.4}

/* delta pill */
.pill{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px 0 6px;
      border-radius:var(--r-chip);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pill svg{width:13px;height:13px;stroke-width:2.6}
.pill--gain{color:var(--gain);background:color-mix(in srgb,var(--gain) 13%,transparent)}
.pill--loss{color:var(--loss);background:color-mix(in srgb,var(--loss) 13%,transparent)}

/* segmented range control */
.seg{display:flex;gap:2px;background:color-mix(in srgb,var(--ink) 6%,transparent);
     border-radius:var(--r-ctl);padding:2px}
.seg span{flex:1;text-align:center;font-size:13px;font-weight:500;color:var(--ink-2);
          padding:5px 0;border-radius:9px}
.seg span[data-on]{background:var(--surface-el);color:var(--ink);font-weight:600;
                   box-shadow:0 1px 3px rgba(0,0,0,.10)}

/* allocation donut */
.donut{transform:rotate(-90deg)}
.donut circle{fill:none;stroke-linecap:butt}
.alloc-key{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 0}
.alloc-key .dot{width:8px;height:8px;border-radius:3px;flex:none}
.alloc-key .nm{flex:1;color:var(--ink-2)}
.alloc-key .pc{font-weight:600;font-variant-numeric:tabular-nums}

/* ledger + holding rows */
.mono{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
      font-size:13px;font-weight:700;letter-spacing:-.3px}
.lrow{display:flex;align-items:center;gap:12px;padding:11px var(--margin);min-height:56px}
.lrow .bd{flex:1;min-width:0}
.lrow .n1{font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .n2{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tr{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.lrow .amt{font-size:16px;font-weight:600;letter-spacing:-.3px}
.lrow .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.grp{background:var(--surface-el);border-radius:var(--r-card);overflow:hidden}
.grp .lrow+.lrow{border-top:.5px solid var(--hairline)}
.day-hd{display:flex;justify-content:space-between;align-items:baseline;
        padding:15px var(--margin) 7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.day-hd em{font-style:normal;font-weight:500;font-variant-numeric:tabular-nums;opacity:.75}

/* keypad */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.keys button{all:unset;height:52px;display:grid;place-items:center;border-radius:var(--r-ctl);
             font-size:27px;font-weight:400;letter-spacing:-.5px;color:var(--ink);
             font-variant-numeric:tabular-nums;cursor:default}
.keys button.k-alt{font-size:22px}
.cta{height:52px;border-radius:26px;background:var(--accent);color:#fff;display:flex;
     align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600}

/* progress ring (goal) */
.ring circle{fill:none;stroke-linecap:round}
</style>
<style>
/* ---------- screen-3 immersive hero ---------- */
.hero-dark{background:#0B1412;color:#FFF;position:relative;
  --ink:#FFF;--ink-2:rgba(235,235,245,.62);--ink-3:rgba(235,235,245,.34);--accent:#2FBFA8}
.hero-dark .seg{background:rgba(255,255,255,.10)}
.hero-dark .seg span{color:rgba(235,235,245,.62)}
.hero-dark .seg span[data-on]{background:rgba(255,255,255,.92);color:#0B1412;box-shadow:none}
.stat-grid{display:grid;grid-template-columns:1fr 1fr}
.stat-grid>div{padding:11px 0}
.stat-grid>div:nth-child(odd){padding-right:14px;border-right:.5px solid var(--hairline)}
.stat-grid>div:nth-child(even){padding-left:14px}
.stat-grid>div:nth-child(-n+4){border-bottom:.5px solid var(--hairline)}
.stat-grid .k{font-size:12.5px;color:var(--ink-2)}
.stat-grid .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.2px}
.actionbar{position:absolute;left:21px;right:21px;bottom:21px;height:60px;border-radius:30px;
  display:flex;align-items:center;gap:8px;padding:6px;z-index:5}
.actionbar .b{flex:1;height:48px;border-radius:24px;display:grid;place-items:center;
  font-size:17px;font-weight:600;letter-spacing:-.2px}
.actionbar .b--buy{background:var(--accent);color:#fff}
.actionbar .b--sell{color:var(--ink)}
</style>
<style>
/* ---------- s4 order sheet ---------- */
.scrim{position:absolute;inset:0;background:#0B1412}
.scrim .blurstrip{position:absolute;inset:0;filter:blur(18px) saturate(120%);opacity:.55}
.sheet{position:absolute;left:0;right:0;bottom:0;top:104px;background:var(--surface-el);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;overflow:hidden;
  box-shadow:0 -12px 40px rgba(0,0,0,.35)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--ink);opacity:.18;
  margin:8px auto 0}
.quick{display:flex;gap:8px}
.quick span{flex:1;height:34px;border-radius:var(--r-ctl);display:grid;place-items:center;
  font-size:14px;font-weight:600;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.quick span[data-on]{background:var(--accent-soft);color:var(--accent)}
.inforow{display:flex;justify-content:space-between;align-items:center;
  font-size:14.5px;padding:11px 0}
.inforow .k{color:var(--ink-2)}
.inforow .v{font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}

/* ---------- s5 celebration ---------- */
.celebrate{position:absolute;inset:0;
  background:radial-gradient(120% 70% at 50% 8%,color-mix(in srgb,var(--accent) 22%,transparent) 0%,transparent 62%),var(--surface)}
.ghost{height:50px;border-radius:25px;display:grid;place-items:center;font-size:17px;
  font-weight:600;color:var(--accent);background:var(--accent-soft)}

/* ---------- s6 settings ---------- */
.inset{background:var(--surface-el);border-radius:var(--r-card);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px var(--s5);min-height:48px}
.srow+.srow{border-top:.5px solid var(--hairline)}
.srow .ic{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;
  color:#fff;flex:none}
.srow .lb{flex:1;font-size:16.5px;letter-spacing:-.2px}
.srow .val{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.srow .chev{color:var(--ink-3);flex:none}
.tgl{width:51px;height:31px;border-radius:16px;background:var(--accent);position:relative;flex:none}
.tgl::after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:14px;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22)}
.tgl--off{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.tgl--off::after{left:2px}
</style>
