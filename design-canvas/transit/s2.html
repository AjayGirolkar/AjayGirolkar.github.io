<!-- 02 · Route options — sheet at HALF. The map keeps enough of itself to stay oriented
     while three whole journeys are comparable at once. Each option is a line-colour strip
     rather than a card, so the network's palette does the grouping the border would. -->
<div class="ios">
<div class="stack">
  <div class="map">
    {{MAP}}
    <div class="pin" style="left:298px;top:132px"></div>
    <div class="pin b" style="left:90px;top:464px"></div>
  </div>
  {{SB}}
  <div class="mapctl" style="top:104px"><svg class="i"><use href="#ic-target"/></svg></div>

  <div class="sheet" style="height:456px">
    <div class="grab"></div>
    <p class="kick" style="margin-bottom:5px">Rosenthaler Platz &rarr; Prenzlauer Allee</p>
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <p class="h1">Leave now</p>
      <span class="cap tm">09:41</span>
    </div>

    <hr class="hair" style="margin-top:11px">
    <div style="padding:13px 0">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
        {{B_U8}}<span class="cap" style="color:var(--ink-3)">&rarr;</span>{{B_M10}}
        <span class="cap" style="margin-left:auto">2 changes &middot; 1.1&nbsp;km walk</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:9px">
        <span class="h1" style="font-size:24px">17 min</span>
        <span class="cap tm">09:41 &rarr; 09:58</span>
        <span class="kick" style="margin-left:auto;color:#2E9E5B">Fastest</span>
      </div>
    </div>

    <hr class="hair">
    <div style="padding:13px 0">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
        {{B_M10}}
        <span class="cap" style="margin-left:auto">No changes &middot; 300&nbsp;m walk</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:9px">
        <span class="h1" style="font-size:24px">23 min</span>
        <span class="cap tm">09:44 &rarr; 10:07</span>
        <span class="kick" style="margin-left:auto">Simplest</span>
      </div>
    </div>

    <hr class="hair">
    <div style="padding:13px 0">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
        {{B_U2}}<span class="cap" style="color:var(--ink-3)">&rarr;</span>{{B_S1}}
        <span class="cap" style="margin-left:auto">1 change &middot; step-free</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:9px">
        <span class="h1" style="font-size:24px">21 min</span>
        <span class="cap tm">09:46 &rarr; 10:07</span>
        <span class="kick" style="margin-left:auto">Step-free</span>
      </div>
    </div>
    <hr class="hair">
    <div class="home"></div>
  </div>
</div>
</div>
