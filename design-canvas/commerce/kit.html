<!-- KIT-START -->

<style>
/* ---------- tokens ---------- */
.ios{
  --w:393px; --h:852px;

  /* type */
  --f-sys:-apple-system,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --f-round:-apple-system,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif;
  --t-large:34px; --t-title:22px; --t-head:17px; --t-body:17px;
  --t-sec:15px; --t-cap:13px; --t-tab:11px;

  /* space scale */
  --s1:2px;--s2:4px;--s3:8px;--s4:12px;--s5:16px;--s6:20px;--s7:24px;--s8:32px;--s9:40px;--s10:56px;
  --margin:16px;

  /* concentric radii */
  --r-sheet:38px; --r-card:20px; --r-ctl:12px; --r-chip:8px;

  /* light palette */
  --ink:#000; --ink-2:rgba(60,60,67,.60); --ink-3:rgba(60,60,67,.30);
  --surface:#F2F2F7; --surface-el:#FFF; --hairline:rgba(60,60,67,.14);
  --accent:#0A7E76;                     /* override per app — never purple */
  --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --gain:#1C8C4B; --loss:#C2382F; --warn:#B26A00;
  --glass-blur:24px; --glass-sat:180%;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ios{
    --ink:#FFF; --ink-2:rgba(235,235,245,.60); --ink-3:rgba(235,235,245,.30);
    --surface:#000; --surface-el:#1C1C1E; --hairline:rgba(235,235,245,.16);
    --gain:#30D158; --loss:#FF453A; --warn:#FF9F0A;
  }
}
[data-theme="dark"] .ios{
  --ink:#FFF; --ink-2:rgba(235,235,245,.60); --ink-3:rgba(235,235,245,.30);
  --surface:#000; --surface-el:#1C1C1E; --hairline:rgba(235,235,245,.16);
  --gain:#30D158; --loss:#FF453A; --warn:#FF9F0A;
}

/* ---------- device shell ---------- */
.ios{
  width:var(--w); height:var(--h); position:relative; overflow:hidden;
  border-radius:var(--r-sheet); background:var(--surface); color:var(--ink);
  font-family:var(--f-sys); font-size:var(--t-body); line-height:1.29;
  -webkit-font-smoothing:antialiased;
}
.ios *{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.ios svg text{font-family:var(--f-sys)}
.ios svg text.rnd{font-family:var(--f-round)}   /* rounded design, monetary figures only */
.money{font-family:var(--f-round);font-variant-numeric:tabular-nums}

/* ---------- glass (chrome only) ---------- */
.glass{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:.5px solid rgba(255,255,255,.60);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.70),inset 0 -1px 0 rgba(255,255,255,.15),
             0 8px 24px rgba(0,0,0,.10);
}
[data-theme="dark"] .glass{
  background:rgba(28,28,30,.55); border-color:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),
             0 8px 28px rgba(0,0,0,.40);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .glass{
    background:rgba(28,28,30,.55); border-color:rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),
               0 8px 28px rgba(0,0,0,.40);
  }
}
.glass--rim{position:relative}
.glass--rim::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:.5px;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.15) 38%,rgba(255,255,255,0) 62%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--surface-el);backdrop-filter:none;-webkit-backdrop-filter:none;
         box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .glass--rim::after{display:none}
}

/* ---------- chrome ---------- */
.statusbar{
  height:59px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 8px;font-size:15px;font-weight:600;letter-spacing:.2px;position:relative;z-index:5;
}
.statusbar .glyphs{display:flex;gap:5px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
        width:125px;height:36px;border-radius:18px;background:#000;z-index:6}

.navbar{height:44px;display:flex;align-items:center;justify-content:space-between;
        padding:0 var(--margin);font-size:var(--t-head);font-weight:600}
.navbar--large{display:block;height:auto;padding:4px var(--margin) 8px}
.navbar--large h1{font-size:var(--t-large);font-weight:700;letter-spacing:-.5px;margin:0}

.tabbar{
  position:absolute;left:21px;right:21px;bottom:21px;height:56px;border-radius:28px;
  display:flex;align-items:center;justify-content:space-around;z-index:5;
}
.tabitem{display:flex;flex-direction:column;align-items:center;gap:3px;
         font-size:var(--t-tab);color:var(--ink-2);min-width:44px}
.tabitem[aria-current]{color:var(--accent)}

.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
         width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;z-index:7}

/* ---------- content primitives ---------- */
.card{background:var(--surface-el);border-radius:var(--r-card);padding:var(--s6)}
.hair{height:.5px;background:var(--hairline);border:0;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;
      border-radius:var(--r-chip);font-size:var(--t-cap);font-weight:600}
.chip--gain{color:var(--gain);background:color-mix(in srgb,var(--gain) 12%,transparent)}
.chip--loss{color:var(--loss);background:color-mix(in srgb,var(--loss) 12%,transparent)}
.row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--margin)}
.row .lead{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.row .body{flex:1;min-width:0}
.row .t1{font-size:var(--t-body)}
.row .t2{font-size:var(--t-cap);color:var(--ink-2);margin-top:1px}
.row .trail{text-align:right}
.sec-hd{font-size:var(--t-cap);font-weight:600;letter-spacing:.4px;text-transform:uppercase;
        color:var(--ink-2);padding:var(--s7) var(--margin) var(--s3)}
.i{width:24px;height:24px;display:inline-block;vertical-align:-5px;
   stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i--sm{width:20px;height:20px;stroke-width:1.8}
.i--fill{fill:currentColor;stroke:none}
</style>
