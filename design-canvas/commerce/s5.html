<div class="ios">
  <div class="island"></div>
  <div class="stack">
{{SB}}
    <div class="topbar">
      <div class="wordmark">ShopEase</div>
      <div class="tb-act">
        <svg class="i" style="width:21px;height:21px"><use href="#ic-search"/></svg>
        <svg class="i" style="width:22px;height:22px"><use href="#ic-bag"/></svg>
      </div>
    </div>

    <div class="scroll">
      <!-- BOLD MOVE: an empty vessel IS the illustration. No line-art shopping cart. -->
      <div class="bleed" style="height:270px">
        <img src="{{IMG_TENMOKU}}" alt="An empty tea bowl">
      </div>
      <div class="pad" style="text-align:center;margin-top:6px">
        <div class="dsp" style="font-size:31px">Nothing in the bag</div>
        <p style="font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:13px 24px 0">
          Saved pieces stay for 30 days. Six studios restock on the first of the month.</p>
        <div class="btn" style="margin-top:26px">Browse the shop</div>
        <div class="lbl lbl--ink" style="margin-top:18px">View saved · 4</div>
      </div>

      <!-- an empty screen is still a merchandising surface -->
      <hr class="rule" style="margin-top:26px">
      <div class="pad" style="padding-top:16px">
        <div class="lbl lbl--ink">Recently viewed</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:12px">
          <div><img class="ph ph--45" src="{{IMG_STEM}}" alt="{{NM_STEM}}">
            <div class="price" style="font-size:12px;margin-top:7px">{{PR_STEM}}</div></div>
          <div><img class="ph ph--45" src="{{IMG_PEONY}}" alt="{{NM_PEONY}}">
            <div class="price" style="font-size:12px;margin-top:7px">{{PR_PEONY}}</div></div>
          <div><img class="ph ph--45" src="{{IMG_BINAKOL}}" alt="{{NM_BINAKOL}}">
            <div class="price price--sale" style="font-size:12px;margin-top:7px"><b>{{PR_BINAKOL}}</b></div></div>
        </div>
      </div>
    </div>

    <div class="dock">
      <a href="#">Shop</a><a href="#">Search</a><a href="#">Saved</a>
      <a href="#" aria-current="page">Bag</a><a href="#">Account</a>
    </div>
    <div class="homebar"></div>
  </div>
</div>
