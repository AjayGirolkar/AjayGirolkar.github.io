<div class="ios">
  <div class="island"></div>
  <div class="stack">
{{SB}}
    <div class="topbar">
      <svg class="i" style="width:22px;height:22px"><use href="#ic-chev-l"/></svg>
      <div class="tb-act">
        <svg class="i" style="width:21px;height:21px"><use href="#ic-search"/></svg>
        <span class="bagdot">
          <svg class="i" style="width:22px;height:22px"><use href="#ic-bag"/></svg><b>2</b></span>
      </div>
    </div>

    <div class="scroll">
      <div class="pad" style="padding-top:4px">
        <div class="dsp" style="font-size:30px">Ceramics</div>
        <div class="maker" style="margin-top:9px;letter-spacing:.13em">18 objects · 6 studios</div>
      </div>

      <div class="rail" style="margin-top:16px">
        <a href="#" aria-current="page">All</a>
        <a href="#">Teaware</a><a href="#">Vases</a><a href="#">Bowls</a><a href="#">Boxes</a>
      </div>
      <hr class="rule">

      <div class="pad" style="display:flex;align-items:center;justify-content:space-between;
           height:40px">
        <span class="lbl lbl--ink">Sort · Newest</span>
        <span class="lbl lbl--ink" style="display:flex;align-items:center;gap:7px">Filter
          <svg class="i i--sm" style="width:14px;height:14px"><use href="#ic-filter"/></svg></span>
      </div>
      <hr class="rule">

      <div class="pad" style="padding-top:18px">
        <div class="grid">
          <div class="pcell">
            <img class="ph ph--45" src="{{IMG_KYUSU}}" alt="{{NM_KYUSU}}">
            <svg class="i i--sm wish" style="width:17px;height:17px"><use href="#ic-heart"/></svg>
            <div class="maker">{{MK_KYUSU}}</div>
            <div class="pname">{{NM_KYUSU}}</div>
            <div class="price"><b>{{PR_KYUSU}}</b></div>
          </div>
          <div class="pcell">
            <img class="ph ph--45" src="{{IMG_CELADON}}" alt="{{NM_CELADON}}">
            <svg class="i i--sm wish" style="width:17px;height:17px"><use href="#ic-heart"/></svg>
            <div class="maker">{{MK_CELADON}}</div>
            <div class="pname">{{NM_CELADON}}</div>
            <div class="price"><b>{{PR_CELADON}}</b></div>
          </div>
        </div>
      </div>

      <!-- BOLD MOVE: the grid breaks. One object goes full width and the rhythm resets. -->
      <div class="bleed" style="margin-top:24px;height:222px;overflow:hidden">
        <img src="{{WIDE_MEIPING}}" alt="{{NM_MEIPING}}">
        <div class="overlay" style="padding-bottom:16px">
          <div style="display:flex;align-items:flex-end;gap:14px">
            <div style="flex:1">
              <div class="lbl">Editor's pick</div>
              <div class="dsp" style="font-size:22px;margin-top:7px">{{NM_MEIPING}}</div>
              <div class="maker" style="margin-top:7px">{{MK_MEIPING}}</div>
            </div>
            <div class="price price--sale" style="text-align:right">
              <div><span class="was">{{WAS_MEIPING}}</span></div>
              <div style="margin-top:4px;font-size:15px"><b>{{PR_MEIPING}}</b>
                <span class="off">{{OFF_MEIPING}}</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dock">
      <a href="#" aria-current="page">Shop</a>
      <a href="#">Search</a><a href="#">Saved</a><a href="#">Bag</a><a href="#">Account</a>
    </div>
    <div class="homebar"></div>
  </div>
</div>
