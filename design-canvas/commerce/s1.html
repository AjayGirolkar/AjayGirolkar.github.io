<div class="ios">
  <div class="island"></div>
  <div class="stack">
{{SB}}
    <div class="topbar">
      <div class="wordmark">ShopEase</div>
      <div class="tb-act">
        <svg class="i" style="width:21px;height:21px"><use href="#ic-search"/></svg>
        <span class="bagdot">
          <svg class="i" style="width:22px;height:22px"><use href="#ic-bag"/></svg><b>2</b></span>
      </div>
    </div>

    <div class="scroll">
      <!-- BOLD MOVE: one object at 430pt, on the ground, no container, type over it -->
      <div class="bleed" style="height:404px">
        <img src="{{HERO_CAMEO}}" alt="{{NM_CAMEO}}">
        <div class="overlay">
          <div class="lbl">The Glass Edit · 12 pieces</div>
          <div class="dsp dsp--l" style="font-size:37px;margin-top:11px">Objects that<br>hold the light</div>
          <div style="display:flex;align-items:baseline;gap:10px;margin-top:15px">
            <span class="maker">{{MK_CAMEO}}</span>
            <span class="price" style="margin-left:auto;font-size:15px"><b>{{PR_CAMEO}}</b></span>
          </div>
        </div>
      </div>

      <!-- dense counterweight: three objects, tight, right after all that air -->
      <div class="pad" style="padding-top:22px">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <div class="lbl lbl--ink">New this week</div>
          <div class="lbl lbl--ink">See all</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:13px">
          <div>
            <img class="ph ph--45" src="{{IMG_TENMOKU}}" alt="{{NM_TENMOKU}}">
            <div class="pname" style="font-size:13px;margin-top:8px">{{NM_TENMOKU}}</div>
            <div class="price" style="font-size:12px;margin-top:3px">{{PR_TENMOKU}}</div>
          </div>
          <div>
            <img class="ph ph--45" src="{{IMG_SCROLL}}" alt="{{NM_SCROLL}}">
            <div class="pname" style="font-size:13px;margin-top:8px">{{NM_SCROLL}}</div>
            <div class="price" style="font-size:12px;margin-top:3px">{{PR_SCROLL}}</div>
          </div>
          <div>
            <img class="ph ph--45" src="{{IMG_COIL}}" alt="{{NM_COIL}}">
            <div class="pname" style="font-size:13px;margin-top:8px">{{NM_COIL}}</div>
            <div class="price" style="font-size:12px;margin-top:3px">{{PR_COIL}}</div>
          </div>
        </div>

        <hr class="rule" style="margin-top:26px">
        <div style="display:flex;align-items:center;gap:12px;padding-top:14px">
          <div style="flex:1">
            <div class="pname" style="font-size:15px">In the studio: Mira Kaur</div>
            <div class="maker" style="margin-top:6px;letter-spacing:.11em">Read · 6 min</div>
          </div>
          <svg class="i i--sm" style="width:17px;height:17px;color:var(--ink-3)"><use href="#ic-chev-r"/></svg>
        </div>
      </div>
    </div>

    <div class="dock">
      <a href="#" aria-current="page">Shop</a>
      <a href="#">Search</a>
      <a href="#">Saved</a>
      <a href="#">Bag</a>
      <a href="#">Account</a>
    </div>
    <div class="homebar"></div>
  </div>
</div>
